<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Portafolio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  /* ---------- ETAPA 1: RICKROLL ---------- */
  #stage-rick {
    position: fixed; inset: 0;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    z-index: 30;
    cursor: pointer;
    transition: opacity 0.6s ease;
  }
  #stage-rick.hide { opacity: 0; pointer-events: none; }
  #stage-rick iframe {
    width: 100%; height: 100%; border: 0; pointer-events: none;
  }
  #rick-hint {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    color: #fff; font-family: Arial, sans-serif; font-size: 14px;
    background: rgba(0,0,0,0.55); padding: 8px 16px; border-radius: 20px;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* ---------- ETAPA 2: TEXTO PLANO A PROPÓSITO ---------- */
  #stage-plain {
    position: fixed; inset: 0;
    background: #ffffff;
    display: none;
    align-items: flex-start; justify-content: flex-start;
    z-index: 20;
    padding: 20px;
  }
  #stage-plain p {
    font-family: Times New Roman, Times, serif;
    font-size: 16px;
    color: #000000;
  }

  /* ---------- ETAPA 3: PÁGINA "BONITA" ---------- */
  #stage-final {
    position: fixed; inset: 0;
    z-index: 10;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
    text-align: center;
    background: linear-gradient(135deg, #1f2937, #111827 60%, #0b0f1a);
    color: #f5f5f5;
    font-family: 'Segoe UI', Arial, sans-serif;
    opacity: 0;
    transition: opacity 1.4s ease;
  }
  #stage-final.show { display: flex; opacity: 1; }

  .cone {
    font-size: 70px;
    animation: bounce 1.6s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-18px) rotate(6deg); }
  }

  #stage-final h1 {
    margin-top: 20px;
    font-size: clamp(28px, 6vw, 48px);
    letter-spacing: 1px;
  }
  #stage-final p.sub {
    margin-top: 10px;
    font-size: 16px;
    color: #b8c1cf;
  }

  .stripes {
    margin-top: 30px;
    width: min(340px, 80vw);
    height: 18px;
    border-radius: 4px;
    background-image: repeating-linear-gradient(
      45deg,
      #f5c518, #f5c518 14px,
      #111827 14px, #111827 28px
    );
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }

  .grid-deco {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(4, 1fr);
    opacity: 0.06;
    pointer-events: none;
  }
  .grid-deco div { border: 1px solid #ffffff; }
</style>
</head>
<body>

  <!-- ETAPA 1 -->
  <div id="stage-rick">
    <iframe id="ytf"
      src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&playsinline=1"
      title="cargando" allow="autoplay; encrypted-media" allowfullscreen>
    </iframe>
    <div id="rick-hint">Cargando portafolio… haz clic si no ves nada</div>
  </div>

  <!-- ETAPA 2 -->
  <div id="stage-plain">
    <p>Página en construcción.</p>
  </div>

  <!-- ETAPA 3 -->
  <div id="stage-final">
    <div class="grid-deco">
      <div></div><div></div><div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div><div></div><div></div>
    </div>
    <div class="cone">🚧</div>
    <h1>Página en construcción</h1>
    <p class="sub">Vuelve pronto, esto se pone bueno.</p>
    <div class="stripes"></div>
  </div>

<script>
  const rickStage = document.getElementById('stage-rick');
  const plainStage = document.getElementById('stage-plain');
  const finalStage = document.getElementById('stage-final');
  const ytf = document.getElementById('ytf');
  const hint = document.getElementById('rick-hint');

  // Un clic en cualquier parte de la etapa 1 intenta activar el sonido
  rickStage.addEventListener('click', () => {
    ytf.src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=0&controls=0&modestbranding=1&rel=0&playsinline=1";
    hint.style.display = 'none';
  });

  // Después de ~12s, pasamos a la etapa 2 (texto plano, a propósito feo)
  setTimeout(() => {
    rickStage.classList.add('hide');
    setTimeout(() => {
      rickStage.style.display = 'none';
      plainStage.style.display = 'flex';
    }, 600);
  }, 12000);

  // 4s después de la etapa 2, transición suave (ease) a la etapa final
  setTimeout(() => {
    plainStage.style.display = 'none';
    finalStage.classList.add('show');
  }, 16000);
</script>

</body>
</html>
