<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Portafolio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  /* ---------- ETAPA 1: PANTALLA DE "CARGA" (sin video hasta el clic) ---------- */
  #stage-rick {
    position: fixed; inset: 0;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    z-index: 30;
    cursor: pointer;
    transition: opacity 0.6s ease;
  }
  #stage-rick.hide { opacity: 0; pointer-events: none; }

  #loading-ui {
    color: #fff; font-family: Arial, sans-serif; text-align: center;
  }
  .spinner {
    width: 46px; height: 46px; margin: 0 auto 18px;
    border: 4px solid rgba(255,255,255,0.25);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-ui p { font-size: 15px; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  #vimeo-wrap {
    position: absolute; inset: 0; display: none;
  }
  #vimeo-wrap iframe { width: 100%; height: 100%; border: 0; pointer-events: none; }

  /* ---------- ETAPA 2: TEXTO PLANO A PROPÓSITO ---------- */
  #stage-plain {
    position: fixed; inset: 0;
    background: #ffffff;
    display: none;
    align-items: flex-start; justify-content: flex-start;
    z-index: 20;
    padding: 20px;
  }
  #stage-plain p {
    font-family: Times New Roman, Times, serif;
    font-size: 16px;
    color: #000000;
  }

  /* ---------- ETAPA 3: PÁGINA "BONITA" (sube como cortina) ---------- */
  #stage-final {
    position: fixed; inset: 0;
    z-index: 25;
    display: flex;
    align-items: center; justify-content: center;
    flex-direction: column;
    text-align: center;
    background: linear-gradient(135deg, #1f2937, #111827 60%, #0b0f1a);
    color: #f5f5f5;
    font-family: 'Segoe UI', Arial, sans-serif;
    transform: translateY(100%);
    transition: transform 1.1s cubic-bezier(0.65, 0, 0.35, 1);
  }
  #stage-final.show { transform: translateY(0); }

  .cone {
    font-size: 70px;
    animation: bounce 1.6s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-18px) rotate(6deg); }
  }

  #stage-final h1 {
    margin-top: 20px;
    font-size: clamp(28px, 6vw, 48px);
    letter-spacing: 1px;
  }
  #stage-final p.sub {
    margin-top: 10px;
    font-size: 16px;
    color: #b8c1cf;
  }

  .stripes {
    margin-top: 30px;
    width: min(340px, 80vw);
    height: 18px;
    border-radius: 4px;
    background-image: repeating-linear-gradient(
      45deg,
      #f5c518, #f5c518 14px,
      #111827 14px, #111827 28px
    );
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }

  .grid-deco {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(4, 1fr);
    opacity: 0.06;
    pointer-events: none;
  }
  .grid-deco div { border: 1px solid #ffffff; }
</style>
</head>
<body>

  <!-- ETAPA 1 -->
  <div id="stage-rick">
    <div id="loading-ui">
      <div class="spinner"></div>
      <p>Cargando portafolio… haz clic para continuar</p>
    </div>
    <div id="vimeo-wrap"></div>
  </div>

  <!-- ETAPA 2 -->
  <div id="stage-plain">
    <p>Página en construcción.</p>
  </div>

  <!-- ETAPA 3 -->
  <div id="stage-final">
    <div class="grid-deco">
      <div></div><div></div><div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div><div></div><div></div>
    </div>
    <div class="cone">🚧👒</div>
    <h1>Página en construcción</h1>
    <p class="sub">Plot twist: no tengo portafolio. Nunca lo tuve xd</p>
    <div class="stripes"></div>
  </div>

<script src="https://player.vimeo.com/api/player.js"></script>
<script>
  // ID de video en Vimeo. Los embeds de Vimeo casi nunca traen anuncios.
  const VIMEO_ID = "148751763";

  const rickStage = document.getElementById('stage-rick');
  const loadingUi = document.getElementById('loading-ui');
  const vimeoWrap = document.getElementById('vimeo-wrap');
  const plainStage = document.getElementById('stage-plain');
  const finalStage = document.getElementById('stage-final');

  let vimeoPlayer;
  let started = false;
  let clicked = false;

  // El iframe se crea RECIÉN al hacer clic. Esto es clave: los navegadores
  // permiten audio real cuando el elemento nace directamente dentro del
  // gesto del usuario, a diferencia de "desmutear" algo que ya estaba cargado.
  rickStage.addEventListener('click', () => {
    if (clicked) return;
    clicked = true;

    loadingUi.style.display = 'none';
    vimeoWrap.style.display = 'block';
    vimeoWrap.innerHTML =
      '<iframe src="https://player.vimeo.com/video/' + VIMEO_ID +
      '?autoplay=1&muted=0&background=0&controls=0&title=0&byline=0&portrait=0&loop=0"' +
      ' allow="autoplay; fullscreen" allowfullscreen></iframe>';

    const iframeEl = vimeoWrap.querySelector('iframe');
    vimeoPlayer = new Vimeo.Player(iframeEl);
    vimeoPlayer.setVolume(1).catch(() => {});

    vimeoPlayer.on('play', () => {
      if (!started) {
        started = true;
        goToStage2After(12000);
      }
    });

    // Red de seguridad: si Vimeo nunca confirma que empezó a reproducir
    // (bloqueador de contenido, error de red), avanzamos igual a los 15s.
    setTimeout(() => { if (!started) { started = true; goToStage2After(0); } }, 15000);
  });

  function fadeVolumeTo(target, durationMs) {
    if (!vimeoPlayer) return;
    vimeoPlayer.getVolume().then(startVol => {
      const steps = 12;
      let i = 0;
      const interval = setInterval(() => {
        i++;
        const v = startVol + (target - startVol) * (i / steps);
        vimeoPlayer.setVolume(v).catch(() => {});
        if (i >= steps) clearInterval(interval);
      }, durationMs / steps);
    }).catch(() => {});
  }

  function goToStage2After(delayMs) {
    setTimeout(() => {
      // Bajamos a 33% en vez de cortar: sigue sonando de fondo, como soundtrack.
      fadeVolumeTo(0.33, 800);
      rickStage.classList.add('hide');
      setTimeout(() => {
        rickStage.style.zIndex = 5; // se queda sonando detrás, ya no se ve
        plainStage.style.display = 'flex';
      }, 600);
    }, delayMs);

    // 4s después de la etapa 2, la página final sube como cortina y la tapa
    setTimeout(() => {
      finalStage.classList.add('show');
      setTimeout(() => { plainStage.style.display = 'none'; }, 1200);
    }, delayMs + 4000);
  }
</script>

</body>
</html>
